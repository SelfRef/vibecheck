name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, such as 0.4.0
        required: true
        type: string

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Set the version and move Unreleased changes and links under it
        run: node scripts/release.mjs "$VERSION" > "$RUNNER_TEMP/notes.md"
      - run: pnpm check
      - run: pnpm package
      - name: Commit and tag the release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "chore(release): $VERSION"
          git tag "v$VERSION"
          git push origin "HEAD:$GITHUB_REF_NAME" "v$VERSION"
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "v$VERSION"
          build/*.shell-extension.zip build/*.shell-extension.zip.sha256
          --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"

  # The AUR packages built from the release (scripts/aur.sh), pushed by the AURomatic account, a
  # co-maintainer of each, as commits by SelfRef. AUR_SSH_KEY is that account's private key,
  # without a passphrase. makepkg refuses root: a user of its own runs it.
  aur:
    name: Update the AUR packages
    needs: release
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v7
      - name: Update and push
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          VERSION: ${{ inputs.version }}
        run: |
          pacman -Syu --noconfirm --needed git openssh pacman-contrib
          useradd -m builder
          key=/home/builder/aur-key
          printf '%s\n' "$AUR_SSH_KEY" > "$key"
          chown builder "$key"
          chmod 600 "$key"
          runuser -u builder -- env HOME=/home/builder AUR_KEY="$key" \
            GIT_AUTHOR_NAME=SelfRef GIT_AUTHOR_EMAIL=git@selfref.dev \
            GIT_COMMITTER_NAME=SelfRef GIT_COMMITTER_EMAIL=git@selfref.dev \
            scripts/aur.sh "$VERSION"
